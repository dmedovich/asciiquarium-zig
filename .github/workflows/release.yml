name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_name: linux-x86_64
          - os: ubuntu-24.04-arm
            target_name: linux-aarch64
          - os: macos-15
            target_name: macos-aarch64
          - os: macos-15-intel
            target_name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Test
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Test terminal
        run: python3 tools/test_terminal.py
      - name: Package
        shell: bash
        run: |
          version="$(cat VERSION)"
          dir="asciiquarium-zig-${version}-${{ matrix.target_name }}"
          mkdir "$dir"
          cp zig-out/bin/asciiquarium-zig "$dir/"
          cp README.md LICENSE fish.conf "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target_name }}
          path: asciiquarium-zig-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Build source archive and checksums
        run: |
          version="$(cat VERSION)"
          git archive --format=tar.gz --prefix="asciiquarium-zig-${version}/" -o "dist/asciiquarium-zig-${version}-source.tar.gz" HEAD
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Generate Homebrew formula
        run: python3 tools/generate_formula.py "dist/asciiquarium-zig-$(cat VERSION)-source.tar.gz" --output dist/asciiquarium-zig.rb
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/asciiquarium-zig.rb
